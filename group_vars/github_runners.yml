---
# Everything a GitHub Actions runner host needs, for every host in the
# github_runners inventory group. The inventory (including Semaphore's static
# one) only lists which hosts are in the group - this file is committed so
# Renovate can bump the versions below.
#
# Loaded by playbooks/vars_plugins/nomadable_group_vars.py for any host in a
# group named like this file, whatever inventory the run uses.

# Registration and lifecycle of the runner are the actions-runner Nomad job in
# Jellify/Nomad-Jobs, which lands on these hosts via the `inventory_groups`
# node meta Nomadintosh's nomad role publishes. The runner binary itself is
# pre-warmed here (/opt/actions-runner/current) rather than downloaded by the
# job: its tarball holds more files than Nomad's artifact getter allows
# (4096). That job hardcodes the paths these roles produce
# (/opt/actions-runner/current, /opt/maestro/current/bin, the openjdk@17
# JAVA_HOME, the Android SDK root) - keep them in sync.
#
# Xcode and its iOS simulator runtime need nothing here: Nomadintosh installs
# them for every macOS host in this group (a "magic group" there). Sign in to
# the App Store on each Mac before its first deploy - mas can't.

# Keep in sync with packageManager in Jellify-Music/App's package.json, which
# sets the version for its GitHub-hosted runners.
# renovate: datasource=github-releases depName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
github_runner_bun_version: "1.4.2"
# renovate: datasource=github-releases depName=actions/runner extractVersion=^v(?<version>.+)$
github_runner_actions_runner_version: "2.337.0"
# renovate: datasource=github-releases depName=mobile-dev-inc/maestro extractVersion=^cli-(?<version>.+)$
github_runner_maestro_version: "2.5.1"

# The oven-sh/bun tap is tapped and trusted automatically because the
# formula is fully qualified. exclusive removes any other bun formula first
# (every version links bin/bun).
additional_homebrew_packages__github_runners:
  - name: "oven-sh/bun/bun@{{ github_runner_bun_version }}"
    exclusive: true
  # CocoaPods and fastlane for the App's iOS jobs. Keep the major.minor in sync
  # with ios/.ruby-version in Jellify-Music/App, which sets the exact version
  # for its GitHub-hosted runners; Homebrew always installs the line's latest
  # patch. The actions-runner job puts /opt/homebrew/opt/ruby@4.0/bin on PATH,
  # which keeps pointing at 4.0 once Homebrew's plain `ruby` moves past it.
  - ruby@4.0

release_archives__github_runners:
  # Unpacks flat, so /opt/actions-runner/current is the runner root (run.sh).
  # The job copies it into each allocation, so pruning an old version never
  # pulls it out from under a running runner.
  - name: actions-runner
    version: "{{ github_runner_actions_runner_version }}"
    url: "https://github.com/actions/runner/releases/download/v{{ github_runner_actions_runner_version }}/actions-runner-osx-arm64-{{ github_runner_actions_runner_version }}.tar.gz"
    dest: /opt/actions-runner
  - name: maestro
    version: "{{ github_runner_maestro_version }}"
    url: "https://github.com/mobile-dev-inc/maestro/releases/download/cli-{{ github_runner_maestro_version }}/maestro.zip"
    dest: /opt/maestro

# Pre-warmed so CI runs never download SDK pieces. Matches the Jellify App's
# android/build.gradle (compileSdk, buildTools, NDK, CMake) and the Maestro
# workflow's emulator image; Gradle still fetches anything that drifts.
android_sdk:
  enabled: true
android_sdk_packages:
  - platform-tools
  - emulator
  - platforms;android-37.0
  - build-tools;37.0.0
  - ndk;27.1.12297006
  - cmake;3.22.1
  - system-images;android-34;google_apis;arm64-v8a
