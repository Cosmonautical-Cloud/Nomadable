---
all:
  vars:
    # SSH connection settings — applied to every host
    ansible_user: youruser

    # Extra Homebrew packages to install on every host (optional)
    additional_homebrew_packages: []
    #   - fastfetch

    # NFS server to mount nfs_mounts_shares from - required if any host sets
    # nfs_mounts_shares (no default)
    # nas_host: 192.0.2.10

# Datacenters come from each host's DNS name, so hosts must be listed by
# fully qualified name: the second-to-last label is the Nomad datacenter
# (server1.homelab.example -> homelab, client3.games.example -> games), and
# the Consul servers' shared label is everyone's Consul datacenter. Group
# names are free - use them to organise hosts and for roles/Nomad targeting.
# Hosts with `server: true` form the control plane; all others are client nodes.
# See inventory/README.md for the full variable reference.

homelab:
  hosts:
    server1.homelab.example:
      server: true
    server2.homelab.example:
      server: true
    server3.homelab.example:
      server: true

    client1.homelab.example:
      podman: true

    client2.homelab.example:
      docker: true

games:
  hosts:
    client3.games.example:
      docker: true

# Membership only - what these hosts get is in
# group_vars/github_runners.yml. Groups can mix hosts from
# any datacenter.
github_runners:
  hosts:
    client2.homelab.example:
